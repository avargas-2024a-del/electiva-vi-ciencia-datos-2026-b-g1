<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
    <marker id="flg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>

  <text x="560" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Flujo de datos - Urbana Store (tienda de ropa online)</text>

  <!-- ===== 1. FUENTE  (azul draw.io) ===== -->
  <rect x="20" y="55" width="240" height="355" fill="#ffffff" stroke="#666666"/>
  <rect x="20" y="55" width="240" height="30" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="140" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">1. FUENTE</text>

  <rect x="40" y="110" width="200" height="60" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="140" y="135" text-anchor="middle" font-size="12.5" fill="#000000">Tienda online</text>
  <text x="140" y="152" text-anchor="middle" font-size="11.5" fill="#333333">Pedidos (tabla)</text>

  <rect x="40" y="182" width="200" height="60" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="140" y="207" text-anchor="middle" font-size="12.5" fill="#000000">Pasarela y transportadora</text>
  <text x="140" y="224" text-anchor="middle" font-size="11.5" fill="#333333">Eventos JSON</text>

  <rect x="40" y="254" width="200" height="60" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="140" y="279" text-anchor="middle" font-size="12.5" fill="#000000">Redes y WhatsApp</text>
  <text x="140" y="296" text-anchor="middle" font-size="11.5" fill="#333333">Reseñas y comentarios</text>

  <rect x="40" y="326" width="200" height="60" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="140" y="351" text-anchor="middle" font-size="12.5" fill="#000000">Catálogo</text>
  <text x="140" y="368" text-anchor="middle" font-size="11.5" fill="#333333">Fotografías</text>

  <!-- ===== 2. ALMACENAMIENTO  (verde draw.io) ===== -->
  <rect x="300" y="55" width="240" height="355" fill="#ffffff" stroke="#666666"/>
  <rect x="300" y="55" width="240" height="30" fill="#d5e8d4" stroke="#82b366"/>
  <text x="420" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">2. ALMACENAMIENTO</text>

  <rect x="320" y="140" width="200" height="60" fill="#d5e8d4" stroke="#82b366"/>
  <text x="420" y="165" text-anchor="middle" font-size="12.5" fill="#000000">Base de datos relacional</text>
  <text x="420" y="182" text-anchor="middle" font-size="11.5" fill="#333333">Pedidos estructurados</text>

  <rect x="320" y="212" width="200" height="60" fill="#d5e8d4" stroke="#82b366"/>
  <text x="420" y="237" text-anchor="middle" font-size="12.5" fill="#000000">Data lake</text>
  <text x="420" y="254" text-anchor="middle" font-size="11.5" fill="#333333">JSON, texto e imágenes</text>

  <rect x="320" y="284" width="200" height="60" fill="#d5e8d4" stroke="#82b366"/>
  <text x="420" y="309" text-anchor="middle" font-size="12.5" fill="#000000">Bodega de datos</text>
  <text x="420" y="326" text-anchor="middle" font-size="11.5" fill="#333333">Datos ya consolidados</text>

  <!-- ===== 3. ANALISIS  (naranja draw.io) ===== -->
  <rect x="580" y="55" width="240" height="355" fill="#ffffff" stroke="#666666"/>
  <rect x="580" y="55" width="240" height="30" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="700" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">3. ANÁLISIS</text>

  <rect x="600" y="140" width="200" height="60" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="700" y="165" text-anchor="middle" font-size="12.5" fill="#000000">Limpieza y ETL</text>
  <text x="700" y="182" text-anchor="middle" font-size="11.5" fill="#333333">Python / pandas</text>

  <rect x="600" y="212" width="200" height="60" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="700" y="237" text-anchor="middle" font-size="12.5" fill="#000000">Analítica descriptiva</text>
  <text x="700" y="254" text-anchor="middle" font-size="11.5" fill="#333333">Ventas por SKU y talla</text>

  <rect x="600" y="284" width="200" height="60" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="700" y="309" text-anchor="middle" font-size="12.5" fill="#000000">Analítica predictiva</text>
  <text x="700" y="326" text-anchor="middle" font-size="11.5" fill="#333333">Pronóstico de demanda</text>

  <!-- ===== 4. VISUALIZACION  (morado draw.io) ===== -->
  <rect x="860" y="55" width="240" height="355" fill="#ffffff" stroke="#666666"/>
  <rect x="860" y="55" width="240" height="30" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="980" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">4. VISUALIZACIÓN</text>

  <rect x="880" y="176" width="200" height="60" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="980" y="201" text-anchor="middle" font-size="12.5" fill="#000000">Tablero de control</text>
  <text x="980" y="218" text-anchor="middle" font-size="11.5" fill="#333333">Power BI</text>

  <rect x="880" y="248" width="200" height="60" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="980" y="273" text-anchor="middle" font-size="12.5" fill="#000000">Reporte semanal</text>
  <text x="980" y="290" text-anchor="middle" font-size="11.5" fill="#333333">de reposición</text>

  <!-- ===== flechas entre etapas ===== -->
  <line x1="262" y1="232" x2="296" y2="232" stroke="#000000" stroke-width="1.5" marker-end="url(#fl)"/>
  <line x1="542" y1="232" x2="576" y2="232" stroke="#000000" stroke-width="1.5" marker-end="url(#fl)"/>
  <line x1="822" y1="232" x2="856" y2="232" stroke="#000000" stroke-width="1.5" marker-end="url(#fl)"/>

  <!-- ===== decision (amarillo draw.io) ===== -->
  <line x1="980" y1="412" x2="980" y2="434" stroke="#000000" stroke-width="1.5" marker-end="url(#fl)"/>
  <rect x="860" y="438" width="240" height="56" fill="#fff2cc" stroke="#d6b656"/>
  <text x="980" y="462" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000">DECISIÓN</text>
  <text x="980" y="480" text-anchor="middle" font-size="11.5" fill="#333333">Cuánto reponer de cada referencia</text>

  <!-- ===== retorno del ciclo ===== -->
  <path d="M 856 466 L 140 466 L 140 416" fill="none" stroke="#666666" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#flg)"/>
  <text x="480" y="458" text-anchor="middle" font-size="11" fill="#666666">Los pedidos nuevos vuelven a entrar y el ciclo se repite</text>

</svg>
