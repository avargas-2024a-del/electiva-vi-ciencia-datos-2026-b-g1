<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a7d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>

  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#123">
    Ciclo de vida del proyecto de datos — Calidad: Defectos de producción
  </text>

  <!-- Box 1: Pregunta -->
  <g>
    <rect x="140" y="60" width="200" height="90" rx="14" fill="#eef6f6" stroke="#1f7a7d" stroke-width="2"/>
    <circle cx="152" cy="72" r="12" fill="#1f7a7d"/>
    <text x="152" y="76" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">1</text>
    <text x="240" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#123">Pregunta</text>
    <text x="240" y="110" text-anchor="middle" font-size="11" fill="#333">¿Qué factores del proceso</text>
    <text x="240" y="126" text-anchor="middle" font-size="11" fill="#333">aumentan el riesgo de defecto?</text>
  </g>

  <!-- Box 2: Obtener -->
  <g>
    <rect x="380" y="60" width="200" height="90" rx="14" fill="#eef6f6" stroke="#1f7a7d" stroke-width="2"/>
    <circle cx="392" cy="72" r="12" fill="#1f7a7d"/>
    <text x="392" y="76" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">2</text>
    <text x="480" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#123">Obtener</text>
    <text x="480" y="110" text-anchor="middle" font-size="11" fill="#333">Sensores IoT, MES/ERP, SCADA,</text>
    <text x="480" y="126" text-anchor="middle" font-size="11" fill="#333">inspección, dataset Kaggle</text>
  </g>

  <!-- Box 3: Limpiar -->
  <g>
    <rect x="620" y="60" width="200" height="90" rx="14" fill="#eef6f6" stroke="#1f7a7d" stroke-width="2"/>
    <circle cx="632" cy="72" r="12" fill="#1f7a7d"/>
    <text x="632" y="76" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">3</text>
    <text x="720" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#123">Limpiar</text>
    <text x="720" y="110" text-anchor="middle" font-size="11" fill="#333">Validar rangos, tratar valores</text>
    <text x="720" y="126" text-anchor="middle" font-size="11" fill="#333">atípicos y datos faltantes</text>
  </g>

  <!-- Box 4: Analizar -->
  <g>
    <rect x="620" y="280" width="200" height="90" rx="14" fill="#fdf3e7" stroke="#c8791a" stroke-width="2"/>
    <circle cx="632" cy="292" r="12" fill="#c8791a"/>
    <text x="632" y="296" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">4</text>
    <text x="720" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#123">Analizar</text>
    <text x="720" y="330" text-anchor="middle" font-size="11" fill="#333">Diagnóstico de causas +</text>
    <text x="720" y="346" text-anchor="middle" font-size="11" fill="#333">modelo predictivo (KNN)</text>
  </g>

  <!-- Box 5: Visualizar -->
  <g>
    <rect x="380" y="280" width="200" height="90" rx="14" fill="#fdf3e7" stroke="#c8791a" stroke-width="2"/>
    <circle cx="392" cy="292" r="12" fill="#c8791a"/>
    <text x="392" y="296" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">5</text>
    <text x="480" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#123">Visualizar</text>
    <text x="480" y="330" text-anchor="middle" font-size="11" fill="#333">Dashboard Power BI: defectos</text>
    <text x="480" y="346" text-anchor="middle" font-size="11" fill="#333">por turno, proveedor y condición</text>
  </g>

  <!-- Box 6: Decidir -->
  <g>
    <rect x="140" y="280" width="200" height="90" rx="14" fill="#eaf1fb" stroke="#2255a4" stroke-width="2"/>
    <circle cx="152" cy="292" r="12" fill="#2255a4"/>
    <text x="152" y="296" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">6</text>
    <text x="240" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#123">Decidir</text>
    <text x="240" y="330" text-anchor="middle" font-size="11" fill="#333">Ajustar velocidad/temperatura;</text>
    <text x="240" y="346" text-anchor="middle" font-size="11" fill="#333">reforzar inspección de riesgo</text>
  </g>

  <!-- Arrows 1->2, 2->3 -->
  <line x1="340" y1="105" x2="376" y2="105" stroke="#1f7a7d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="105" x2="616" y2="105" stroke="#1f7a7d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Arrow 3->4 (right side, down) -->
  <path d="M 745,150 L 745,276" fill="none" stroke="#946313" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Arrows 4->5, 5->6 -->
  <line x1="616" y1="325" x2="584" y2="325" stroke="#946313" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="376" y1="325" x2="344" y2="325" stroke="#2b5c94" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Arrow 6->1 (loop back, left side) -->
  <path d="M 138,325 L 95,325 L 95,105 L 136,105" fill="none" stroke="#2255a4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="60" y="220" text-anchor="middle" font-size="10.5" fill="#2255a4" transform="rotate(-90 60 220)">el ciclo se repite con cada nuevo lote / periodo</text>

  <text x="450" y="455" text-anchor="middle" font-size="11" fill="#555">
    Basado en el ciclo de vida de un proyecto de ciencia de datos (CORHUILA, 2026)
  </text>
</svg>
